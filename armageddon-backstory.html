<!doctype html>
<html lang="en"><head><script src="src/verify-backend-m6198.js?v=198-release1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARMAGEDDON — Backstory</title>
<style>html:not(.gt-auth-ok) #stage,html:not(.gt-auth-ok) nav{display:none!important}#gt-auth-status{min-height:100dvh;display:grid;place-content:center;text-align:center;gap:16px;padding:28px;font:18px Arial,sans-serif;color:#f5e7cf;background:#071320}html.gt-auth-ok #gt-auth-status{display:none}#gt-auth-status a{color:#b7dfff}</style>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08111c;color:#f5e7cf;font-family:Georgia,serif}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:14px 14px 74px;background:radial-gradient(ellipse at 50% 35%,#23405d,#071320 78%)}
main.blue{background:radial-gradient(ellipse at 50% 35%,#18447b,#061427 78%)}main.red{background:radial-gradient(ellipse at 50% 35%,#6a242b,#160a13 78%)}
#art{display:block;cursor:pointer;max-width:100%;max-height:calc(100dvh - 106px);width:auto;height:auto;object-fit:contain;box-shadow:0 12px 50px #000a;border:1px solid #9c8b64;border-radius:5px}
#art:focus-visible{outline:4px solid #ffcf76;outline-offset:5px}#art:hover{filter:brightness(1.04)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px clamp(14px,4vw,44px);background:#071625f2;border-top:1px solid #6d7f91;z-index:5}
nav .group{display:flex;gap:10px;align-items:center}.button{color:white;cursor:pointer;text-decoration:none;background:linear-gradient(#227fc4,#093d75);border:1px solid #e6bd73;border-radius:8px;padding:10px 20px;font:700 16px system-ui,Arial,sans-serif;white-space:nowrap}.button:hover{filter:brightness(1.2)}.button:focus-visible{outline:3px solid white}.button:disabled{opacity:.4;cursor:default}#counter{font:15px system-ui,Arial,sans-serif;color:#b9cfe0}#music{font-size:13px;padding:9px 12px} .story-options{position:relative;font:13px system-ui,Arial,sans-serif}.story-options summary{list-style:none;cursor:pointer;background:linear-gradient(#227fc4,#093d75);border:1px solid #e6bd73;border-radius:8px;padding:10px 16px;color:white;font-weight:700}.story-options summary::-webkit-details-marker{display:none}.story-options[open] .story-options-panel{display:flex}.story-options-panel{position:absolute;right:0;bottom:calc(100% + 9px);min-width:196px;display:none;flex-direction:column;gap:9px;padding:12px;background:#0b2135;border:1px solid #e6bd73;border-radius:9px;box-shadow:0 6px 16px #000b;z-index:50}.story-options-panel button{width:100%}#musicStatus{max-width:225px;white-space:normal}
@media(max-width:520px){.button{font-size:13px;padding:9px 12px}#counter{font-size:12px}nav{gap:5px}}
</style></head>
<body><section id="gt-auth-status" role="status" aria-live="polite"><strong>Verifying registered GameTopia account…</strong><span id="gt-auth-message">Your account and permanent player ID are required before the backstory.</span><a href="account.html?next=armageddon-backstory.html">Log in or switch account</a></section><main id="stage" aria-label="ARMAGEDDON backstory"><img id="art" src="src/backstory.png" alt="ARMAGEDDON — Blue vs Red common backstory; click to continue" tabindex="0" role="button" aria-label="Continue to the next backstory"></main>
<nav aria-label="Backstory navigation"><div class="group"><button id="back" class="button" type="button">← Back</button><span id="counter" aria-live="polite">1 of 3</span></div><div class="group"><details class="story-options" id="storyOptions"><summary>Options ▾</summary><div class="story-options-panel"><button id="music" class="button" type="button" aria-pressed="false">♫ Music: Off</button><span id="musicStatus" role="status" aria-live="polite" style="font:12px Arial,sans-serif;color:#f7dda8">Music off — select On to play</span></div></details></div></nav>
<script src="src/march.js?v=6.192"></script>
<script>
'use strict';
// M6.203: no backstory is shown until the account is validated by the backend.
// The permanent player ID is required for later game/autosave association.
let gameAccount=null;
try {gameAccount=JSON.parse(sessionStorage.getItem('gt_account')||localStorage.getItem('gt_account')||'null');} catch(_) {}
const loginTarget='account.html?next=armageddon-backstory.html';
const authMessage=document.getElementById('gt-auth-message');
async function verifyBeforeBackstory(){
 if(!gameAccount?.token){location.replace(loginTarget);return;}
 try {
  const response=await fetch('https://gametopia-backend.onrender.com/api/accounts/me', {
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({token:gameAccount.token}),cache:'no-store'
  });
  if(!response.ok){
   if(response.status===401||response.status===403){
    sessionStorage.removeItem('gt_account');localStorage.removeItem('gt_account');
    location.replace(loginTarget);return;
   }
   throw new Error('Account verification is temporarily unavailable (HTTP '+response.status+').');
  }
  const verified=await response.json();
  if(!verified||!verified.token||verified.number===undefined||verified.number===null){
   throw new Error('The server did not return a verified account and permanent player ID.');
  }
  const remembered=!!localStorage.getItem('gt_account');
  gameAccount=verified;
  sessionStorage.setItem('gt_account',JSON.stringify(verified));
  if(remembered)localStorage.setItem('gt_account',JSON.stringify(verified));
  sessionStorage.setItem('gt_entry_mode','registered');
  document.documentElement.classList.add('gt-auth-ok');
 }catch(error){
  authMessage.textContent=(error.message||'Unable to verify your account.')+' Please retry, or log in again.';
  const retry=document.createElement('button');retry.type='button';retry.textContent='Retry verification';
  retry.style.cssText='padding:12px 16px;font:700 16px Arial;background:#174b7b;color:#fff;border:1px solid #e6bd73;border-radius:8px;cursor:pointer';
  retry.addEventListener('click',()=>{retry.remove();authMessage.textContent='Checking account…';verifyBeforeBackstory();});
  document.getElementById('gt-auth-status').appendChild(retry);
 }
}
verifyBeforeBackstory();
const scenes=[
 {src:'src/backstory.png',alt:'ARMAGEDDON — Blue vs Red common backstory',theme:''},
 {src:'src/bluenstein_backstory.png',alt:'Bluenstein national backstory',theme:'blue'},
 {src:'src/redonia_backstory.png',alt:'Redonia national backstory',theme:'red'}
];
const query=new URLSearchParams(location.search);
let page=Math.max(0,Math.min(2,(Number(query.get('step'))||1)-1));
const art=document.getElementById('art'),stage=document.getElementById('stage'),counter=document.getElementById('counter');
function render(){const scene=scenes[page];art.src=scene.src;art.alt=scene.alt+' — click to continue';art.className='';stage.className=scene.theme;counter.textContent=(page+1)+' of 3';history.replaceState(null,'','armageddon-backstory.html'+(page?'?step='+(page+1):''));}
function navigate(delta){if(!document.documentElement.classList.contains('gt-auth-ok'))return;if(delta<0&&page===0){location.href='games.html';return;}if(delta>0&&page===2){window.ARMAGEDDON_MARCH?.stop();location.href='armageddon-lobby.html';return;}page+=delta;render();window.ARMAGEDDON_MARCH?.selectPage(page);window.ARMAGEDDON_MARCH?.start();}
document.getElementById('back').addEventListener('click',()=>navigate(-1));art.addEventListener('click',()=>{startMusicFromGesture();navigate(1);});art.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();startMusicFromGesture();navigate(1);}});
const musicButton=document.getElementById('music'),musicStatus=document.getElementById('musicStatus');
function syncMusicStatus(){const music=window.ARMAGEDDON_MARCH;if(!music)return;musicButton.textContent=music.enabled?'♫ Music: On':'♫ Music: Off';musicButton.setAttribute('aria-pressed',String(!!music.active));musicStatus.textContent=music.active?'Music playing':music.enabled?(music.lastError||'Music enabled — click On again if silent'):'Music off';}
function startMusicFromGesture(){const music=window.ARMAGEDDON_MARCH;if(!music){musicStatus.textContent='Music player unavailable';return;}music.setEnabled(true);music.selectPage(page);music.start();musicStatus.textContent='Starting music…';setTimeout(syncMusicStatus,400);}
musicButton.addEventListener('click',function(){if(window.ARMAGEDDON_MARCH?.enabled){window.ARMAGEDDON_MARCH.setEnabled(false);syncMusicStatus();}else startMusicFromGesture();});
// Each scene has its own selected track. Explicit play satisfies browser autoplay restrictions.
window.ARMAGEDDON_MARCH?.selectPage(page);syncMusicStatus();

window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();navigate(1);}else if(e.key==='ArrowLeft'){e.preventDefault();navigate(-1);}});
render(); // Click anywhere on the image to advance; no Next button. Music starts with the first user gesture, in accordance with browser autoplay rules.
</script><script src="src/version.js?v=6.261"></script></body></html>
