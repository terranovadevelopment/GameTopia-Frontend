<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameTopia M6.198 — Registered Account Login</title><script src="src/verify-backend-m6198.js?v=198-release1"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#244366,#081422 70%);font:17px system-ui,Arial,sans-serif;color:#ecf5ff;padding:16px}.panel{background:#11283f;border:1px solid #7d9ab9;border-radius:14px;padding:clamp(20px,4vw,36px);width:min(100%,430px);box-shadow:0 12px 45px #0008}h1{margin:0 0 6px;font:36px Georgia,serif;color:#ffe0a1}h2{margin:10px 0 18px;font:24px Georgia,serif}.desc{color:#c6d8e8;font-size:15px;line-height:1.5}label{display:block;margin:13px 0 6px;font-weight:600}input{width:100%;padding:12px;border:1px solid #879db4;border-radius:7px;background:#f6fbff;color:#132334;font:16px system-ui}button,.link{border:1px solid #f0c27e;border-radius:8px;background:linear-gradient(#2187ce,#074679);color:white;font:bold 16px system-ui;cursor:pointer;padding:12px 17px;text-align:center;text-decoration:none}button:disabled{opacity:.65;cursor:wait}.primary{width:100%;margin:16px 0 8px}.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:10px 0 14px}.small{font:15px system-ui;color:#c9ddf2;background:transparent;border:0;padding:5px;cursor:pointer;text-decoration:underline}hr{border:0;border-top:1px solid #56718a;margin:19px 0}#error{color:#ffc1b1;min-height:20px;font-size:14px}#success{color:#baf2ce;min-height:20px;font-size:14px}.hidden{display:none!important}.password-show{display:flex;align-items:center;gap:9px;margin:9px 0 5px;font-size:15px;cursor:pointer}.password-show input{width:auto;accent-color:#1984dc}.back{display:inline-block;color:#c7e8ff;margin-bottom:18px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffcf77;outline-offset:2px}
</style></head><body><main class="panel"><a class="back" id="back" href="armageddon-lobby.html">← Back to Games</a><h1>GameTopia</h1><p class="desc" id="intent">Sign in or register to play GameTopia.</p><section id="accountResume" class="hidden" aria-live="polite"><h2>Welcome Back</h2><p id="knownPlayer" class="desc"></p><button id="continueRegistered" class="primary" type="button">Continue as Registered Player</button><button id="switchAccount" class="small" type="button">Use Another Account</button></section><section id="loginSection"><h2>Log In</h2><form id="loginForm"><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><label class="password-show"><input type="checkbox" id="showLoginPassword"> Show password</label><label class="password-show"><input id="rememberMe" type="checkbox"> Remember Me on this computer</label><button class="primary" type="submit">Continue to Game</button></form><div class="actions"><button type="button" class="small" id="registerOpen">Register New Account</button></div></section><section id="registerSection" class="hidden"><h2>Register</h2><form id="registerForm"><label for="newEmail">Email Address</label><input id="newEmail" type="email" autocomplete="email" required maxlength="254"><label for="newPassword">Password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="256" pattern="[A-Za-z0-9]{8,256}" title="Use at least 8 characters (letters and numbers only)"><label class="password-show"><input type="checkbox" id="showRegisterPassword"> Show password</label><label for="newName">Screen Name</label><input id="newName" autocomplete="nickname" required minlength="3" maxlength="40"><p class="desc">Password rule (M6.198): 8 or more letters or numbers. No special characters.</p><label class="password-show"><input id="rememberRegistration" type="checkbox" checked> Remember Me on this computer</label><button type="submit" class="primary">Register</button></form><button type="button" id="returnLogin" class="small">Back to Log In</button></section><div id="error" role="alert" aria-live="assertive"></div><div id="success" role="status" aria-live="polite"></div></main><script>
(function(){'use strict';
 const params=new URLSearchParams(location.search),requested=params.get('next')||'armageddon-lobby.html';
 // Only same-origin game destinations, never external links or special schemes.
 const allowed=/^(?:armageddon-lobby\.html|armageddon\.html\?(?:createLobby=1|joinGame=[a-zA-Z0-9_-]+))$/;
 const next=allowed.test(requested)?requested:'armageddon-lobby.html';
 const isStart=next.includes('createLobby=1');document.getElementById('intent').textContent=isStart?'Create a game: sign in or register.':next.includes('joinGame=')?'Join a game: sign in or register.':'Sign in or register.';
 const $=id=>document.getElementById(id),error=$('error'),success=$('success');
 function message(err,ok){error.textContent=err||'';success.textContent=ok||'';}
 function showRegister(yes){$('loginSection').classList.toggle('hidden',yes);$('registerSection').classList.toggle('hidden',!yes);message();}
 function go(){location.assign(next);}
 function putAccount(account,remember){sessionStorage.setItem('gt_account',JSON.stringify(account));if(remember)localStorage.setItem('gt_account',JSON.stringify(account));else localStorage.removeItem('gt_account');sessionStorage.setItem('gt_entry_mode','registered');localStorage.setItem('armageddon_last_display_name',account.screenName||account.name||'Player');}
 function clearAccount(){sessionStorage.removeItem('gt_account');localStorage.removeItem('gt_account');}
 async function resumeStoredAccount(){
  let stored=null;try{stored=JSON.parse(sessionStorage.getItem('gt_account')||localStorage.getItem('gt_account')||'null')}catch(_){}
  if(!stored?.token)return;
  try{const account=await post('/api/accounts/me',{token:stored.token});
   putAccount(account,!!localStorage.getItem('gt_account'));
   $('knownPlayer').textContent='Signed in as '+(account.screenName||account.name)+' · Permanent player ID '+account.number;
   $('accountResume').classList.remove('hidden');$('loginSection').classList.add('hidden');$('registerSection').classList.add('hidden');
  }catch(e){clearAccount();message('Saved login expired. Please sign in again.');}
 }
 $('continueRegistered').onclick=()=>{sessionStorage.setItem('gt_entry_mode','registered');go()};
 $('switchAccount').onclick=async()=>{let a=null;try{a=JSON.parse(sessionStorage.getItem('gt_account')||'null')}catch(_){}if(a?.token){try{await post('/api/accounts/logout',{token:a.token})}catch(_){}}clearAccount();$('accountResume').classList.add('hidden');$('loginSection').classList.remove('hidden');message();};
 async function post(route,values){const response=await fetch('https://gametopia-backend.onrender.com'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||'Could not complete request');return result;}
 for(const [checkId,pwId] of [['showLoginPassword','password'],['showRegisterPassword','newPassword']]) $(checkId).addEventListener('change',()=>{$(pwId).type=$(checkId).checked?'text':'password'});
 $('registerOpen').onclick=()=>showRegister(true);$('returnLogin').onclick=()=>showRegister(false);
 $('loginForm').addEventListener('submit',async e=>{e.preventDefault();message();const button=e.target.querySelector('button[type=submit]');button.disabled=true;try{const account=await post('/api/accounts/login',{email:$('email').value.trim(),password:$('password').value});putAccount(account,$('rememberMe').checked);$('password').value='';go();}catch(ex){message(ex.message)}finally{button.disabled=false}});
 $('registerForm').addEventListener('submit',async e=>{e.preventDefault();message();const button=e.target.querySelector('button[type=submit]');button.disabled=true;const email=$('newEmail').value.trim(),password=$('newPassword').value,screenName=$('newName').value.trim();if(!/^[A-Za-z0-9]{8,256}$/.test(password)){message('Password must have at least 8 letters or numbers, with no special characters.');button.disabled=false;return;}try{const account=await post('/api/accounts/register',{email,password,screenName,name:screenName});putAccount(account,$('rememberRegistration').checked);$('newPassword').value='';go();}catch(ex){message(ex.message)}finally{button.disabled=false}});
 resumeStoredAccount();
 
})();
</script><script src="src/version.js?v=6.198"></script></body></html>
