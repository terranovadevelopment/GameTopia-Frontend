*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#244366,#07111f 70%);color:#f4e5c5;font-family:Georgia,serif;min-height:100vh}main{max-width:1050px;margin:auto;padding:28px 20px 70px}a{color:#f5cf82}h1{font-size:clamp(30px,5vw,55px);text-align:center;color:#ffd28b;margin:22px 0 4px}h2{color:#ffdb9d}.sub{text-align:center;color:#d3e0f1;font-size:19px;margin:0 0 26px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin:24px 0}.btn{display:inline-block;background:linear-gradient(#197dc8,#06427e);border:1px solid #f3c477;border-radius:9px;padding:13px 20px;color:white;text-decoration:none;font:700 17px system-ui,Arial,sans-serif;cursor:pointer}.btn:hover{filter:brightness(1.2)}.btn:focus-visible{outline:3px solid white}.muted{color:#b4c9db}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.game{border:1px solid #a98a59;border-radius:12px;background:#0d2135;padding:20px;box-shadow:0 8px 22px #0006}.game h3{margin:0 0 8px;color:#ffe0a5;font-size:23px}.game p{color:#d1dfec;line-height:1.5;margin:7px 0 15px}.meta{font-size:14px;color:#a8c4e0}.notice{padding:17px 20px;border:1px solid #6c849e;border-radius:9px;background:#10283c;color:#d4e4f3}#status{min-height:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.refresh{background:transparent;border:1px solid #7899b8;border-radius:7px;padding:9px 13px;color:#e5f0fa;cursor:pointer}

/* M6.198 compact, scrollable saved-game catalog */
.autosave-scroll{max-height:260px;overflow-y:auto;overscroll-behavior:contain;border:1px solid #536d86;border-radius:7px;margin-top:10px}

.autosave-row:hover,.autosave-row:focus-visible{background:#244766;outline:1px solid #e2b96b}

@media(max-width:580px){.autosave-header,.autosave-row{grid-template-columns:minmax(90px,2fr) 50px minmax(108px,1fr);gap:5px;font-size:12px}.autosave-expires{display:none}}

/* M6.205: one row per permanent game ID, with saves only in the picker */
.game-catalog{border:1px solid #6a849c;border-radius:10px;overflow:hidden;background:#10283c}
.game-head,.game-row{display:grid;grid-template-columns:minmax(115px,2fr) minmax(70px,.8fr) minmax(110px,1.2fr) 55px minmax(77px,.85fr) 95px minmax(145px,1.8fr);gap:10px;align-items:center;padding:9px 12px}
.game-head{background:#203b53;color:#e4edfa;font:700 13px system-ui,Arial,sans-serif}
.game-scroll{height:min(53vh,390px);min-height:185px;overflow-y:auto;overscroll-behavior:contain}

.game-row:nth-child(even){background:#142e45}

.game-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game-row .description{white-space:normal;line-height:1.3;color:#bcd2e5}.game-row .btn:focus-visible{outline:2px solid #ffdf8c}
.game-row .btn{font-size:13px;padding:7px 7px;min-width:69px}
.game-row .btn[disabled]{opacity:.6;cursor:wait}
#savePicker[hidden]{display:none!important}#savePicker{position:fixed;inset:0;z-index:10000;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px}#savePickerPanel{background:#10283c;border:2px solid #d6ac66;border-radius:12px;padding:20px;width:min(730px,100%);max-height:85vh;display:flex;flex-direction:column;gap:12px;color:#f5e9cf;box-shadow:0 12px 40px #000b}#savePickerPanel h2{margin:0}#savePickerList{overflow-y:auto;min-height:90px;max-height:56vh;border:1px solid #66829c;border-radius:7px}#savePickerList .game-row{grid-template-columns:100px 1fr 98px}#savePickerList .game-row span{white-space:normal}#savePickerClose{align-self:flex-end} .autosave-label{font-size:12px;color:#ffe2a9;font-weight:bold}
.game-note{color:#b8cbdb;font:12px system-ui,Arial,sans-serif;margin:8px 0 0}
@media(max-width:760px){main{padding:16px 10px 30px}.game-catalog{overflow-x:auto}.game-head,.game-scroll .game-row{min-width:800px}.game-scroll{max-height:55vh}.game-row .btn{font-size:12px;padding:7px 3px;min-width:0}.toolbar{margin:12px 0}}
</style></head><body><main>
<div class="top"><a class="btn" href="armageddon-backstory.html?step=3">← Back</a><button class="btn" type="button" data-gametopia-howto>How to Play</button><a class="btn" href="index.html">GameTopia Welcome</a></div>
<h1>ARMAGEDDON</h1>
<div class="toolbar"><a class="btn" id="gtStartNewGame" href="account.html?next=armageddon.html%3FcreateLobby%3D1">Start New Game</a><span id="gtAccountStatus" class="muted"></span><a class="btn" href="account.html">Account / Log In</a></div>
<h2 style="margin:10px 0 9px">Available Games</h2>
<div class="game-catalog" aria-label="Games available to resume, join, or load">
 <div class="game-head"><span>Game</span><span>Player (Host)</span><span>Created</span><span>Turn</span><span>Status</span><span>Action</span><span>Description</span></div>
 <div id="gameRows" class="game-scroll" role="list" aria-live="polite"><div class="game-row"><span>Loading games…</span></div></div>
</div>
<p id="status" role="status" class="game-note">Checking games and autosaves…</p>
<div id="savePicker" hidden role="presentation"><section id="savePickerPanel" role="dialog" aria-modal="true" aria-labelledby="savePickerTitle"><h2 id="savePickerTitle">Autosaves</h2><p class="game-note" id="savePickerSubtitle">Choose an autosave to restore.</p><div id="savePickerList" aria-label="Available autosaves" tabindex="0"></div><button type="button" class="btn" id="savePickerClose">Close</button></section></div>
</main><script>
'use strict';
const API='https://gametopia-backend.onrender.com';
const rows=document.getElementById('gameRows'),status=document.getElementById('status');
const snapshot={public:[],enrolled:[],saves:[],errors:[],saveCatalogOk:false};
let refreshToken=0;
function accountInfo(){try{return JSON.parse(sessionStorage.getItem('gt_account')||localStorage.getItem('gt_account')||'null')}catch(_){return null}}
const account=accountInfo();
// Entry to game catalog requires a registered identity. Preserve the catalog destination.
if(!account?.token){location.replace('account.html?next=armageddon-lobby.html');}
const picker=document.getElementById('savePicker'),pickerList=document.getElementById('savePickerList');
function closeSavePicker(){picker.hidden=true;}
document.getElementById('savePickerClose').addEventListener('click',closeSavePicker);
picker.addEventListener('click',e=>{if(e.target===picker)closeSavePicker();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!picker.hidden)closeSavePicker();});
function saveTime(save){return Date.parse(save.createdAt||save.savedAt||save.saved_at||save.timestamp||save.created||save.date||0)||0;}
function displayDate(value){const ms=Date.parse(value||0);return Number.isFinite(ms)&&ms>0?new Date(ms).toLocaleString():'—';}
function permanentGameId(item){const id=item.gameId??item.game_id??item.originalGameId??item.sourceGameId??item.game?.id??item.id;return id===undefined||id===null||id===''?'':String(id);}
function openSavePicker(group){
 document.getElementById('savePickerTitle').textContent=(group.name||'ARMAGEDDON')+' — Autosaves';
 document.getElementById('savePickerSubtitle').textContent=group.saves.length+' autosave(s). Select a turn to restore. Original ownership is preserved.';
 pickerList.replaceChildren();
 const saves=[...group.saves].sort((a,b)=>saveTime(b)-saveTime(a)||(Number(b.turn)||0)-(Number(a.turn)||0));
 for(const save of saves){
  const row=document.createElement('div');row.className='game-row';
  pushCell(row,'Turn '+(save.turn??'—'));
  pushCell(row,displayDate(save.createdAt||save.savedAt||save.saved_at||save.timestamp||save.created||save.date));
  const btn=document.createElement('button');btn.type='button';btn.className='btn';btn.textContent='Load';
  btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='Loading…';try{await loadSave(save)}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='Load'}});
  row.append(btn);pickerList.append(row);
 }
 picker.hidden=false;document.getElementById('savePickerClose').focus();
}

if(!account?.token)document.getElementById('gtAccountStatus').textContent='Please log in to join or resume a game';
document.getElementById('gtAccountStatus').textContent=account?.number?'Signed in: '+(account.screenName||account.name||'Player')+' · ID '+account.number:'Please log in or register to play';
async function request(url,options){const response=await fetch(API+url,options||{cache:'no-store'});const payload=await response.json().catch(()=>({}));if(!response.ok)throw Error((payload.error||payload.message||'Server returned '+response.status)+' (HTTP '+response.status+')');return payload}
function pushCell(row,text){const el=document.createElement('span');el.textContent=text;el.title=text;row.append(el)}
function actionButton(row,entry){
 const btn=document.createElement(entry.action==='Join'?'a':'button');btn.className='btn';btn.textContent=entry.action==='Autosaves'?'View Saves':entry.action;
 if(entry.action==='Join'&&!entry.restoredMember){
  btn.href='account.html?next='+encodeURIComponent('armageddon.html?joinGame='+entry.id);
 }else{
  btn.type='button';btn.addEventListener('click',async()=>{
   btn.disabled=true;btn.textContent=entry.action==='Autosaves'?'View Saves':entry.action==='Load'?'Loading…':entry.restoredMember?'Joining…':'Resuming…';
   try{if(entry.action==='Autosaves'){openSavePicker(entry);btn.disabled=false;btn.textContent='View Saves';return;}if(entry.action==='Load')await loadSave(entry.save);else await resumeGame(entry.id,entry.side)}
   catch(e){alert(e.message);btn.disabled=false;btn.textContent=entry.action}
  });
 }
 row.append(btn);
}
function render(){
 const enrolled=new Map(snapshot.enrolled.map(g=>[permanentGameId(g),g]));
 // One catalog entry per permanent game ID. Never merge different IDs merely
 // because people reused the same game name.
 const byGame=new Map();
 function getGame(id){if(!byGame.has(id))byGame.set(id,{id,name:'ARMAGEDDON',saves:[],live:null,mine:null});return byGame.get(id)}
 for(const g of snapshot.public){
  if(!['lobby','planning','executing','replaying','initiation'].includes(g.status))continue;
  const id=permanentGameId(g);if(!id)continue;
  if(!Array.isArray(g.players)||!g.players.some(p=>p.role==='active'))continue;
  const record=getGame(id);record.live=g;record.name=g.name||record.name;
 }
 for(const g of snapshot.enrolled){const id=permanentGameId(g);if(!id)continue;const record=getGame(id);record.mine=g;record.name=record.live?.name||g.name||record.name;}
 let unmatched=0;
 for(const save of snapshot.saves){
  // The catalog must identify which game owns each save; an individual save
  // ID is not a substitute for its game ID.
  const id=String(save.gameId??save.game_id??save.originalGameId??save.sourceGameId??save.game?.id??'');
  if(!id){unmatched++;continue;}
  const record=getGame(id);record.saves.push(save);
  record.name=record.live?.name||record.mine?.name||save.name||record.name;
 }
 const records=[...byGame.values()].filter(r=>r.live||r.mine||r.saves.length);
 records.sort((a,b)=>Number(!!b.live)-Number(!!a.live)||Math.max(saveTime(b.saves[0]||{}),Date.parse(b.live?.created||b.mine?.created||0)||0)-Math.max(saveTime(a.saves[0]||{}),Date.parse(a.live?.created||a.mine?.created||0)||0)||a.name.localeCompare(b.name));
 rows.replaceChildren();
 let activeCount=0, savedGameCount=0;
 for(const entry of records){
  const live=entry.live||entry.mine;
  const hasLive=!!live;
  if(hasLive)activeCount++;
  if(entry.saves.length)savedGameCount++;
  const mine=entry.mine;
  // A restored save is a NEW game instance. Original members keep their slots,
  // but should see Join until they actively reconnect to this new instance.
  const restored=live?.loadedFrom||mine?.loadedFrom;
  const restoredMember=!!(hasLive&&mine&&restored&&String(restored.loaderAccountId)!==String(account?.number)&&!sessionStorage.getItem('armageddon_identity_'+entry.id));
  const canResume=hasLive&&!!mine&&!restoredMember;
  const canJoin=hasLive&&(!mine||restoredMember);
  const action=canResume?'Resume':canJoin?'Join':'Autosaves';
  const turn=live?.turn??live?.day??(entry.saves.length?Math.max(...entry.saves.map(x=>Number(x.turn)||0)):'—');
  // The Player column is the ORIGINAL HOST, never the player who saved a turn.
  // If the backend omits host metadata, show an explicit unknown instead of a wrong identity.
  const saveHost=entry.saves.find(x=>x.originalHostName||x.creator||x.hostName||x.creatorName||x.host?.name||x.creator?.name);
  const hostValue=live?.originalHostName||live?.creator||live?.creatorName||live?.hostName||live?.creator?.name||live?.host?.name||entry.mine?.originalHostName||entry.mine?.creator||entry.mine?.creatorName||entry.mine?.hostName||saveHost?.originalHostName||saveHost?.creator||saveHost?.hostName||saveHost?.creatorName||saveHost?.host?.name||saveHost?.creator?.name;
  const player=typeof hostValue==='string'?hostValue:(typeof hostValue==='number'?String(hostValue):'Unknown (legacy save)');
  // Date means game creation date; if not supplied, do not mislabel latest autosave date as creation.
  const datedSave=entry.saves.find(x=>x.gameCreatedAt||x.originalGameCreatedAt||x.gameCreated||x.game?.createdAt);
  const date=live?.createdAt||live?.created||entry.mine?.createdAt||entry.mine?.created||datedSave?.gameCreatedAt||datedSave?.originalGameCreatedAt||datedSave?.gameCreated||datedSave?.game?.createdAt||null;
  const phase=String(live?.phase||live?.status||'').toLowerCase();
  const state=hasLive?(phase==='lobby'||phase==='initiation'?'Initiation':phase==='planning'?'Planning':phase==='executing'||phase==='execution'?'Executing':phase==='replaying'||phase==='replay'?'Replaying':'Active'):'Saved';
  const description=entry.saves.length?entry.saves.length+' autosave'+(entry.saves.length===1?'':'s')+(hasLive?' available':''):(hasLive?'Game in progress':'No autosaves');
  const row=document.createElement('div');row.className='game-row';row.setAttribute('role','listitem');
  pushCell(row,entry.name);pushCell(row,player||'—');pushCell(row,displayDate(date));pushCell(row,String(turn));pushCell(row,state);
  // Resume takes priority for an active enrolled game. Its saved states remain
  // accessible via an additional View Saves button in the Description cell.
  actionButton(row,{...entry,action,restoredMember,side:mine?.side||''});
  const desc=document.createElement('span');desc.className='description';desc.textContent=description;
  if(hasLive&&entry.saves.length){
   desc.append(' · ');
   const view=document.createElement('button');view.type='button';view.className='btn';view.style.cssText='padding:5px 8px;font-size:12px;margin-top:3px';view.textContent='View Saves';
   view.addEventListener('click',()=>openSavePicker(entry));desc.append(view);
  }
  row.append(desc);
  if(!hasLive&&entry.saves.length){
   row.style.cursor='pointer';row.tabIndex=0;row.setAttribute('aria-label','View autosaves for '+entry.name);
   row.addEventListener('click',e=>{if(e.target.closest('button,a'))return;openSavePicker(entry)});
   row.addEventListener('keydown',e=>{if(e.target!==row)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();openSavePicker(entry)}});
  }
  rows.append(row);
 }
 if(!records.length){const row=document.createElement('div');row.className='game-row';const cell=document.createElement('span');cell.style.gridColumn='1 / -1';cell.textContent=snapshot.errors.length?'Could not retrieve the complete games/autosaves catalog — see status below':'No games or autosaves were returned by the server for this account';row.append(cell);rows.append(row)}
 status.textContent=(snapshot.saveCatalogOk&&snapshot.saves.length===0?'The backend returned zero autosaves for this account. · ':(!snapshot.saveCatalogOk?'Autosave availability could not be verified. · ':''))+records.length+' game'+(records.length===1?'':'s')+' · '+activeCount+' active · '+savedGameCount+' with autosaves ('+snapshot.saves.length+' saves)'+(unmatched?' · '+unmatched+' autosaves missing a game ID and omitted; backend catalog correction required':'')+(snapshot.errors.length?' · '+snapshot.errors.join('; '):'');
}
async function resumeGame(id){
 if(!account?.token)throw Error('Log in to resume your existing game.');
 const identity=await request('/api/games/'+encodeURIComponent(id)+'/reconnect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accountToken:account.token})});
 sessionStorage.setItem('armageddon_identity_'+id,JSON.stringify(identity));sessionStorage.setItem('armageddon_active_game',id);
 const info=await request('/api/games/'+encodeURIComponent(id)+'/join-info',{cache:'no-store'});
 if(!info.query)throw Error('Game setup not found');
 if(info.status==='lobby'){location.href='armageddon.html?initLobby='+encodeURIComponent(id);return}
 const q=new URLSearchParams(info.query);q.set('gameId',id);q.set('playerSide',identity.side);location.href='armageddon.html?'+q.toString();
}
async function loadSave(save){
 if(!account?.token)throw Error('Log in to load a saved game.');
 if(!confirm('Load '+(save.name||'ARMAGEDDON')+' at Turn '+save.turn+'? Original player ownership is preserved; everyone starts Not Ready.'))return;
 const loaded=await request('/api/saved-games/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:account.token,gameId:save.gameId,turn:save.turn})});
 sessionStorage.setItem('armageddon_identity_'+loaded.id,JSON.stringify({playerId:loaded.playerId,token:loaded.token,side:loaded.side,color:loaded.color,accountId:loaded.accountId}));
 sessionStorage.setItem('armageddon_active_game',loaded.id);
 const games=await request('/api/games',{cache:'no-store'});const g=games.find(g=>g.id===loaded.id);if(!g)throw Error('Restored game not visible');
 const q=new URLSearchParams(g.query);q.set('gameId',loaded.id);q.set('playerSide',loaded.side);location.href='armageddon.html?'+q.toString();
}
async function refresh(){
 const myToken=++refreshToken;const errors=[];
 const tasks=[request('/api/games',{cache:'no-store'}).then(g=>({key:'public',value:Array.isArray(g)?g:[]})),
 account?.token?request('/api/accounts/games',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:account.token})}).then(g=>({key:'enrolled',value:g.games||[]})):Promise.resolve({key:'enrolled',value:[]}),
 account?.token?request('/api/saved-games/catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:account.token})}).then(g=>({key:'saves',value:Array.isArray(g)?g:Array.isArray(g.saves)?g.saves:Array.isArray(g.games)?g.games.flatMap(x=>Array.isArray(x.saves)?x.saves.map(save=>({...save,gameId:save.gameId||x.gameId||x.id,name:save.name||x.name,originalHostName:save.originalHostName||save.creator||x.originalHostName||x.creator||x.hostName||x.creatorName||'',gameCreatedAt:save.gameCreatedAt||x.gameCreatedAt||x.createdAt||''})):[]):[]})):Promise.resolve({key:'saves',value:[]})];
 const results=await Promise.allSettled(tasks);if(myToken!==refreshToken)return;
 results.forEach((r,i)=>{if(r.status==='fulfilled'){snapshot[r.value.key]=r.value.value;if(i===2)snapshot.saveCatalogOk=true;}else{if(i===2)snapshot.saveCatalogOk=false;errors.push(['Active games','My games','Autosaves'][i]+' request failed: '+(r.reason?.message||'network or CORS error'));}});snapshot.errors=errors;render();
}
refresh();setInterval(()=>{if(!document.hidden)refresh()},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script><script src="src/version.js?v=6.248"></script><script src="how-to-play.js?v=6.208" defer></script></body></html>
<script>/* M6.229: new-game transition is an explicit voluntary departure. */
(function(){
 const start=document.getElementById('gtStartNewGame');if(!start)return;
 start.addEventListener('click',async event=>{
  const oldId=sessionStorage.getItem('armageddon_active_game');if(!oldId)return;
  let identity=null;
  try{identity=JSON.parse(sessionStorage.getItem('armageddon_identity_'+oldId)||localStorage.getItem('armageddon_identity_'+oldId)||'null')}catch(_){}
  if(!identity?.token)return;
  event.preventDefault();start.textContent='Leaving previous game…';start.style.pointerEvents='none';
  try{
   const response=await fetch('https://gametopia-backend.onrender.com/api/games/'+encodeURIComponent(oldId)+'/leave',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:identity.token})});
   const body=await response.json().catch(()=>({}));
   if(!response.ok){
    // Already-departed players may legitimately see an expired local membership.
    if(response.status!==403&&response.status!==404)throw Error(body.error||'Leave failed (HTTP '+response.status+')');
   }
   sessionStorage.removeItem('armageddon_identity_'+oldId);localStorage.removeItem('armageddon_identity_'+oldId);sessionStorage.removeItem('armageddon_active_game');
   location.href=start.href;
  }catch(error){alert('Cannot start another game until departure from your current game is confirmed. '+error.message);start.textContent='Start New Game';start.style.pointerEvents='auto';}
 });
})();
</script>
