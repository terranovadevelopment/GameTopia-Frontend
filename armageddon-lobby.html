<!doctype html><html lang="en"><head><script src="src/verify-backend.js?v=6.181"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameTopia — ARMAGEDDON Games</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#244366,#07111f 70%);color:#f4e5c5;font-family:Georgia,serif;min-height:100vh}main{max-width:1050px;margin:auto;padding:28px 20px 70px}a{color:#f5cf82}h1{font-size:clamp(30px,5vw,55px);text-align:center;color:#ffd28b;margin:22px 0 4px}h2{color:#ffdb9d}.sub{text-align:center;color:#d3e0f1;font-size:19px;margin:0 0 26px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin:24px 0}.btn{display:inline-block;background:linear-gradient(#197dc8,#06427e);border:1px solid #f3c477;border-radius:9px;padding:13px 20px;color:white;text-decoration:none;font:700 17px system-ui,Arial,sans-serif;cursor:pointer}.btn:hover{filter:brightness(1.2)}.btn:focus-visible{outline:3px solid white}.muted{color:#b4c9db}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.game{border:1px solid #a98a59;border-radius:12px;background:#0d2135;padding:20px;box-shadow:0 8px 22px #0006}.game h3{margin:0 0 8px;color:#ffe0a5;font-size:23px}.game p{color:#d1dfec;line-height:1.5;margin:7px 0 15px}.meta{font-size:14px;color:#a8c4e0}.notice{padding:17px 20px;border:1px solid #6c849e;border-radius:9px;background:#10283c;color:#d4e4f3}#status{min-height:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.refresh{background:transparent;border:1px solid #7899b8;border-radius:7px;padding:9px 13px;color:#e5f0fa;cursor:pointer}
</style></head><body><main><div class="top"><a class="btn" href="armageddon-backstory.html?step=3" aria-label="Back to Redonia backstory">← Back</a><a class="btn" href="index.html" aria-label="GameTopia Welcome">GameTopia Welcome</a></div><h1>ARMAGEDDON</h1><p class="sub">Blue vs Red — Games Underway</p><div class="toolbar"><a class="btn" href="account.html?next=armageddon.html%3FcreateLobby%3D1">Start New Game</a><span id="gtAccountStatus" class="muted"></span><a class="btn" href="account.html">Account / Log In</a></div><p id="status" role="status" class="muted">Loading games from the GameTopia server…</p><section class="grid" id="games" aria-label="Games underway"></section><p class="notice">To join a game, select <strong>Join Game</strong>. Choose an available color and join either side. A new game opens the ARMAGEDDON setup screen.</p></main><script>
'use strict';
const list=document.getElementById('games'),status=document.getElementById('status');
try{const account=JSON.parse(sessionStorage.getItem('gt_account')||localStorage.getItem('gt_account')||'null');document.getElementById('gtAccountStatus').textContent=account?.number?'Signed in: '+(account.screenName||account.name)+' · ID '+account.number:'Guest mode available';}catch(_){document.getElementById('gtAccountStatus').textContent='Guest mode available';}
async function loadGames(){if(!list.children.length)status.textContent='Checking the server…';try{const response=await fetch('https://gametopia-backend.onrender.com/api/games',{cache:'no-store'});if(!response.ok)throw Error('Server returned '+response.status);const games=await response.json();list.replaceChildren();if(!Array.isArray(games))throw Error('Unexpected server response');const active=games.filter(g=>Array.isArray(g.players)&&g.players.length>0);status.textContent=active.length?active.length+' game'+(active.length===1?'':'s')+' listed':'No games underway yet. Select Start New Game to create one.';for(const g of active){const card=document.createElement('article');card.className='game';const h=document.createElement('h3');h.textContent=g.name||'Unnamed Game';const meta=document.createElement('div');meta.className='meta';meta.textContent='Host: '+(g.creator||'Unknown')+' · Status: '+(g.status||'Unknown');const desc=document.createElement('p');desc.textContent=g.description||'No description provided.';const link=document.createElement('a');link.className='btn';link.textContent='Join Game · Log In / Guest';link.href='account.html?next='+encodeURIComponent('armageddon.html?joinGame='+g.id);card.append(h,meta,desc,link);list.append(card);}}catch(e){status.textContent='Cannot load active games from GameTopia backend. ('+e.message+')';}}

loadGames();setInterval(()=>{if(!document.hidden){loadGames()}},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadGames()}});
</script><script src="src/version.js?v=6.181"></script>
